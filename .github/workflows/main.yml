
name: Build Hyper Fluid Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'hyper-fluid-android-source.zip'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip hyper-fluid-android-source.zip -d source

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: source/hyper-fluid-android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hyper-Fluid-Android-APK
          path: source/hyper-fluid-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
